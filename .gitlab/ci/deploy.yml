deploy-production:
  stage: deploy
  image: alpine:3.21.3
  dependencies:
    - push-images
  environment:
    name: production
  when: manual
  allow_failure: false
  script:
    - sh scripts/ci/deploy/deploy-images.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      exists:
        - deploy/Dockerfiles/Dockerfile*
        - deploy/Dockerfiles/*.dockerfile
    - when: never
