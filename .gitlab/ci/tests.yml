required-tests:
  stage: tests
  image: ubuntu:26.04
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl git
    - curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error https://releases.astral.sh/github/uv/releases/download/0.13.5/uv-installer.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - test "$(uv --version)" = "uv 0.13.5"
  script:
    - bash scripts/ci/run-required-tests.sh python
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
