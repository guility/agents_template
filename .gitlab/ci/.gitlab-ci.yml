variables:
  CI_PLATFORM: gitlab
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

stages:
  - sast
  - build
  - security
  - tests
  - push
  - fetch_secrets
  - deploy

include:
  - local: "/.gitlab/ci/sast.yml"
  - local: "/.gitlab/ci/images.yml"
  - local: "/.gitlab/ci/tests.yml"
  - local: "/.gitlab/ci/deploy.yml"
