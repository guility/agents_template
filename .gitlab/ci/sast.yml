semgrep-sast:
  stage: sast
  image:
    name: semgrep/semgrep:1.99.0
    entrypoint: [""]
  script:
    - semgrep scan --config auto --error --metrics off src tests scripts agents
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

secret-scan:
  stage: sast
  image:
    name: zricethezav/gitleaks:v8.24.3
    entrypoint: [""]
  script:
    - gitleaks detect --source . --redact --exit-code 1
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
