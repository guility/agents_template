semgrep-sast:
  stage: sast
  image:
    name: semgrep/semgrep:1.99.0
    entrypoint: [""]
  script:
    - semgrep scan --config auto --error --metrics off src scripts agents deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

semgrep-sast-mr:
  stage: sast
  tags:
    - untrusted-ci
  image:
    name: semgrep/semgrep:1.99.0
    entrypoint: [""]
  script:
    - semgrep scan --config auto --error --metrics off src scripts agents deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH == $CI_PROJECT_PATH && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH && $AGENTS_MR_CI_ENABLED == "true"'
    - when: never

secret-scan:
  stage: sast
  image:
    name: zricethezav/gitleaks:v8.24.3
    entrypoint: [""]
  script:
    - gitleaks detect --source . --redact --exit-code 1
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

secret-scan-mr:
  stage: sast
  tags:
    - untrusted-ci
  image:
    name: zricethezav/gitleaks:v8.24.3
    entrypoint: [""]
  script:
    - gitleaks detect --source . --redact --exit-code 1
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH == $CI_PROJECT_PATH && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH && $AGENTS_MR_CI_ENABLED == "true"'
    - when: never
