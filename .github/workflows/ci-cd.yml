name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  detect-changes:
    uses: ./.github/workflows/detect-changes.yml

  security-scan:
    needs: detect-changes
    uses: ./.github/workflows/security-scan.yml

  complexity-check:
    needs: detect-changes
    uses: ./.github/workflows/complexity-check.yml

  language-tests:
    needs: [detect-changes, security-scan, complexity-check]
    if: ${{ needs.detect-changes.outputs.has-python == 'true' || needs.detect-changes.outputs.has-nodejs == 'true' || needs.detect-changes.outputs.has-rust == 'true' || needs.detect-changes.outputs.has-go == 'true' || needs.detect-changes.outputs.has-csharp == 'true' || needs.detect-changes.outputs.has-templates == 'true' }}
    uses: ./.github/workflows/language-tests.yml
    with:
      run_python: ${{ needs.detect-changes.outputs.has-python == 'true' || needs.detect-changes.outputs.has-templates == 'true' }}
      run_nodejs: ${{ needs.detect-changes.outputs.has-nodejs == 'true' || needs.detect-changes.outputs.has-templates == 'true' }}
      run_rust: ${{ needs.detect-changes.outputs.has-rust == 'true' || needs.detect-changes.outputs.has-templates == 'true' }}
      run_go: ${{ needs.detect-changes.outputs.has-go == 'true' || needs.detect-changes.outputs.has-templates == 'true' }}
      run_csharp: ${{ needs.detect-changes.outputs.has-csharp == 'true' || needs.detect-changes.outputs.has-templates == 'true' }}

  contract-validation:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.has-contracts == 'true' }}
    uses: ./.github/workflows/contract-validation.yml

  release:
    needs: [language-tests, security-scan]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml

  summary:
    needs: [security-scan, complexity-check, language-tests]
    if: always()
    uses: ./.github/workflows/summary.yml
    with:
      security_result: ${{ needs.security-scan.result }}
      complexity_result: ${{ needs.complexity-check.result }}
      python_result: ${{ needs.language-tests.outputs.python_result || needs.language-tests.result }}
      nodejs_result: ${{ needs.language-tests.outputs.nodejs_result || needs.language-tests.result }}
      rust_result: ${{ needs.language-tests.outputs.rust_result || needs.language-tests.result }}
      go_result: ${{ needs.language-tests.outputs.go_result || needs.language-tests.result }}
      csharp_result: ${{ needs.language-tests.outputs.csharp_result || needs.language-tests.result }}
